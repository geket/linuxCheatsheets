# Goes under ~/.config/alacritty/alacritty.toml
[window]
#padding = { x = 8, y = 8 }
#decorations = "None"     # or "Full"

[font]
size = 5.5

[font.normal]
family = "monospace"
style = "Regular"

[font.bold]
family = "monospace"
style = "Bold"

[font.italic]
family = "monospace"
style = "Italic"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"

# Optional: nice extras
[colors]
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"
